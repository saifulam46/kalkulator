name: Deploy ke GitHub Pages

on:
  push:
    branches:
      - claude/zealous-franklin-s6z2qd
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Hanya boleh ada satu deploy berjalan dalam satu waktu
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Jalankan unit test
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
